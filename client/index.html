<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500..700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time duels – a ranked geography quiz." />
    <title>2T2M Battle</title>
    <script>
      // Gespeichertes Theme und Sprache vor dem ersten Rendern setzen, damit nichts aufblitzt.
      try {
        if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark");
        if (localStorage.getItem("lang")) document.documentElement.lang = localStorage.getItem("lang");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
